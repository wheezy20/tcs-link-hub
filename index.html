<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treasures Christian School — Links</title>
  <meta name="description" content="Official link hub for Treasures Christian School, Ho, Volta Region, Ghana.">

  <link rel="icon" href="public/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="public/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="public/favicon-16x16.png">
  <link rel="apple-touch-icon" href="public/apple-touch-icon.png">
  <link rel="manifest" href="public/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="card-header">
      <a class="logo-link" href="https://tcsch.edu.gh" target="_blank" rel="noopener" aria-label="Visit Treasures Christian School website">
        <img
          class="logo"
          src="public/logomark%20-%20deap%20teal%20bg.png"
          alt="Treasures Christian School logomark"
          width="80"
          height="80">
      </a>
      <h1 class="school-name">Treasures Christian School</h1>
      <p class="tagline">Every child is a treasure</p>
    </header>

    <nav class="links" id="links" aria-label="Treasures Christian School links">
      <!-- Buttons are generated from data/links.js by script.js -->
    </nav>

    <section class="contact" aria-labelledby="contact-title">
      <h2 class="contact-title" id="contact-title">Get in Touch</h2>
      <ul class="contact-list">
        <li class="contact-item">
          <i class="contact-icon" data-lucide="phone" aria-hidden="true"></i>
          <span class="contact-label">Phone</span>
          <a href="tel:+233592651660">+233 59 265 1660</a>
        </li>
        <li class="contact-item">
          <i class="contact-icon" data-lucide="mail" aria-hidden="true"></i>
          <span class="contact-label">Email</span>
          <a href="mailto:info@tcsch.edu.gh">info@tcsch.edu.gh</a>
        </li>
        <li class="contact-item">
          <i class="contact-icon" data-lucide="map-pin" aria-hidden="true"></i>
          <span class="contact-label">Location</span>
          <span>Ho, Volta Region, Ghana</span>
        </li>
      </ul>
    </section>

    <footer class="footer">
      <p>&copy; 2026 Treasures Christian School. All rights reserved.</p>
    </footer>
  </main>

  <script src="data/links.js"></script>
  <script src="https://unpkg.com/lucide@1.37.0/dist/umd/lucide.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
